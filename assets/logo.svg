<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <circle cx="250" cy="250" r="240" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  
  <!-- Header Text -->
  <text x="250" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#000000">Amazon Web Services</text>
  <text x="250" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="28" text-anchor="middle" fill="#000000">Student Community</text>
  
  <!-- Colored Accent Bar -->
  <g transform="translate(100, 255)">
    <rect x="0" y="0" width="75" height="5" fill="#1b2a4a"/>
    <rect x="75" y="0" width="75" height="5" fill="#e51c24"/>
    <rect x="150" y="0" width="75" height="5" fill="#ff9900"/>
    <rect x="225" y="0" width="75" height="5" fill="#00a86b"/>
  </g>
  
  <!-- Main Title -->
  <text x="250" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" letter-spacing="14" text-anchor="middle" fill="#000000">GSMCOE</text>
  
  <!-- Subtitle Motto -->
  <text x="250" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" text-anchor="middle">
    <tspan fill="#000000">Learn</tspan>
    <tspan fill="#e51c24"> | </tspan>
    <tspan fill="#000000">Build</tspan>
    <tspan fill="#ff9900"> | </tspan>
    <tspan fill="#000000">Deploy</tspan>
  </text>
</svg>
